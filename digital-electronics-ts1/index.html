<!doctype html><html lang="en" dir="ltr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Digital Electronics - TS1</title><style>:root{--bg:#f4f7fb;--fg:#12263a;--card:#fff;--bd:#cfd9e6;--hd:#1f4e79;--mut:#5a6b7d;--hov:#e3edf8}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f1720;--fg:#e6edf5;--card:#18232f;--bd:#2c3b4b;--hd:#16365a;--mut:#9fb0c2;--hov:#1f3248}}
:root[data-theme=dark]{--bg:#0f1720;--fg:#e6edf5;--card:#18232f;--bd:#2c3b4b;--hd:#16365a;--mut:#9fb0c2;--hov:#1f3248}
*{box-sizing:border-box}body{font-family:system-ui,Tahoma,sans-serif;margin:0;background:var(--bg);color:var(--fg)}
header{background:var(--hd);color:#fff;padding:22px 16px;text-align:center;position:relative}
header h1{margin:0;font-size:1.5rem}header p{margin:6px 0 0;opacity:.85}
main{max-width:760px;margin:auto;padding:16px}.grid{display:grid;gap:10px}
.card{display:block;padding:16px;min-height:44px;background:var(--card);border-radius:12px;border:1px solid var(--bd);text-decoration:none;color:var(--fg);font-weight:600}
.card:hover,.card:active{background:var(--hov)}.card small{display:block;color:var(--mut);font-weight:400;margin-top:4px}
.back{display:inline-block;margin-bottom:12px;color:var(--hd);text-decoration:none;font-weight:600}
@media(prefers-color-scheme:dark){.back{color:#8fc0f0}}
#t{position:absolute;top:12px;inset-inline-start:12px;min-width:44px;min-height:44px;border:0;border-radius:10px;background:rgba(255,255,255,.18);color:#fff;font-size:1.2rem;cursor:pointer}
</style></head>
<body><header><button id="t" aria-label="Light / dark">◐</button><h1>Digital Electronics - TS1</h1><p>2 chapters</p></header><main><a class="back" href="../">← Students Hub</a><div class="grid"><a class="card" href="ch01-numbering-systems/">Chapter 1: Numbering Systems and Codes</a><a class="card" href="ch02-logic-gates/">Chapter 2: Logic Gates</a><a class="card" href="ch03-boolean-algebra/">Chapter 3: Boolean Algebra</a></div></main><script>(function(){var r=document.documentElement,b=document.getElementById('t');try{var s=localStorage.getItem('hubTheme');if(s)r.setAttribute('data-theme',s)}catch(e){}
function dark(){var t=r.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme:dark)').matches}
b.onclick=function(){var n=dark()?'light':'dark';r.setAttribute('data-theme',n);try{localStorage.setItem('hubTheme',n)}catch(e){}}})();</script></body></html>
